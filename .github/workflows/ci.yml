# Testy przy kazdym pushu i kazdym PR-ze.
#
# DLACZEGO OBA WARIANTY. testDebugUnitTest i testReleaseUnitTest nie uruchamiaja tego
# samego zbioru: testy Compose/Robolectric leza w src/testDebug, bo manifest testowy
# (androidx.compose.ui:ui-test-manifest, deklaruje ComponentActivity) wchodzi tylko do
# wariantu debug. Wariant release ma za to wlaczone R8-owe reguly i inna scalona
# konfiguracje, wiec zielony debug nie dowodzi, ze release sie sklada.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testy:
    name: Testy jednostkowe i paczka debug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Testy jednostkowe (debug i release)
        run: ./gradlew --no-daemon testDebugUnitTest testReleaseUnitTest

      # Paczka debug buduje sie BEZ modeli offline — one nie sa w repozytorium.
      # To jest domyslny tor aplikacji: glos idzie przez silniki systemowe.
      - name: Paczka debug
        run: ./gradlew --no-daemon assembleDebug

      # Wariant z -Pvosk=true wnosi WLASNE zrodla (src/vosk/java) i wlasne testy
      # (src/vosk/test/java), ktorych domyslny build NIE KOMPILUJE ANI NIE URUCHAMIA.
      # Dlatego gnil niezauwazony: recenzja znalazla w nim zapiszWDzienniku() wolajace
      # samo siebie, czyli StackOverflowError przy kazdym starcie nasluchu. Kompilacja
      # i testy tego wariantu nie potrzebuja modeli — brak katalogu assetow znaczy tylko
      # tyle, ze w paczce nie ma czym rozpoznawac, a nie ze build pada.
      - name: Wariant offline — kompilacja i testy
        run: ./gradlew --no-daemon compileDebugKotlin testDebugUnitTest -Pvosk=true

      - name: Raporty z testow
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: raporty-testow
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 7
